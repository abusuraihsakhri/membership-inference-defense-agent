[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "membership-inference-defense-engine"
version = "2.0.0"
description = "MIA-Defense: Model Shadow Training & Membership Inference Risk Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
membership-inference-defense-engine = "mia_defense.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/membership-inference-defense-engine"
Repository = "https://github.com/abusuraihsakhri/membership-inference-defense-engine.git"
