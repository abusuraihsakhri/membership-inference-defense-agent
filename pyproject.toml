[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "membership-inference-defense-engine"
version = "2.0.0"
description = "MIA-Defense: Model Shadow Training & Membership Inference Risk Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[project.scripts]
membership-inference-defense-engine = "mia_defense.cli:main"
membership-inference-defense-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/membership-inference-defense-agent"
Repository = "https://github.com/abusuraihsakhri/membership-inference-defense-agent.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "mia_defense_app"]

[tool.setuptools.packages.find]
include = ["agents*", "mia_defense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
